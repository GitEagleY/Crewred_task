version: '3.9'

services:
  api:
    build: .
    container_name: travel-planner-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/travel.db
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: 
      context: ./travel-planner-frontend
      dockerfile: Dockerfile
    container_name: travel-planner-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./travel-planner-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api